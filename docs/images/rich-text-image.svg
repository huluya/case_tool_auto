<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
  <rect width="1000" height="560" fill="#f5f7fa"/>
  <rect x="80" y="32" width="840" height="496" rx="8" fill="#ffffff" stroke="#dcdfe6"/>
  <rect x="80" y="32" width="840" height="58" fill="#ffffff" stroke="#dcdfe6"/>
  <text x="108" y="69" font-size="20" font-family="Microsoft YaHei,Arial,sans-serif" font-weight="700" fill="#303133">编辑：备注</text>
  <rect x="108" y="110" width="784" height="42" rx="5" fill="#f5f7fa" stroke="#dcdfe6"/>
  <rect x="124" y="118" width="82" height="26" rx="4" fill="#909399"/>
  <text x="141" y="136" font-size="13" font-family="Microsoft YaHei,Arial,sans-serif" fill="#ffffff">删除线</text>
  <text x="222" y="136" font-size="13" font-family="Microsoft YaHei,Arial,sans-serif" fill="#909399">选中文字后可设置格式</text>
  <rect x="108" y="168" width="784" height="255" rx="5" fill="#ffffff" stroke="#409eff" stroke-width="2"/>
  <text x="132" y="208" font-size="17" font-family="Microsoft YaHei,Arial,sans-serif" fill="#303133">用户点击头像后进入图片选择页面。</text>
  <text x="132" y="241" font-size="17" font-family="Microsoft YaHei,Arial,sans-serif" fill="#303133">上传成功后显示以下示例图片：</text>
  <rect x="132" y="263" width="220" height="112" rx="6" fill="#d9ecff" stroke="#409eff"/>
  <circle cx="188" cy="304" r="24" fill="#67c23a"/>
  <path d="M173 308 L185 296 L196 307 L205 298 L224 320 L168 320 Z" fill="#ffffff"/>
  <text x="225" y="329" font-size="16" font-family="Microsoft YaHei,Arial,sans-serif" fill="#409eff">示例图片</text>
  <text x="378" y="303" font-size="17" font-family="Microsoft YaHei,Arial,sans-serif" fill="#303133">图片后仍可继续输入文字。</text>
  <text x="378" y="338" font-size="15" font-family="Microsoft YaHei,Arial,sans-serif" fill="#909399">图片来自虚构测试数据</text>
  <text x="132" y="405" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" fill="#909399">文字、图片可以在同一个备注输入框中混排</text>
  <rect x="108" y="449" width="170" height="34" rx="4" fill="#909399"/>
  <text x="133" y="471" font-size="14" font-family="Microsoft YaHei,Arial,sans-serif" fill="#ffffff">从剪贴板粘贴图片</text>
  <text x="300" y="471" font-size="13" font-family="Microsoft YaHei,Arial,sans-serif" fill="#909399">粘贴后自动保存并显示缩略图</text>
</svg>
